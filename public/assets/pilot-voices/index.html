<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b131b">
<title>中文飞行员 · 人声试听</title><link rel="icon" type="image/jpeg" href="../sky.jpg"><link rel="stylesheet" href="./style.css?v=radio-presets-1">
</head>
<body>
<main>
<header class="topbar"><a id="game-link" href="../../../" data-i18n="back">返回游戏</a><button id="language" type="button" tabindex="-1">English</button></header>
<section class="intro"><p class="eyebrow">SKYLINE / VOICE AUDITIONS</p><h1 data-i18n="title">中文飞行员 · 人声试听</h1><p class="lede" data-i18n="intro">4 个新声音，1 个当前声音作对照。使用相同台词和偏快语速，比较你更喜欢的音色。</p></section>
<nav id="providers" class="provider-nav" aria-label="语音来源"><a id="provider-fish" href="./fish/">Fish Audio · 新候选</a><a id="provider-edge" href="./">Edge TTS · 原候选</a></nav>
<section class="comparison" aria-label="试听设置">
<div class="setting-row"><div class="tabs" id="scripts" role="group" aria-label="通话类型"></div><div class="effect-tabs" role="group" aria-label="音效"><button id="radio" type="button" tabindex="-1" aria-pressed="true" data-i18n="radio">游戏无线电</button><button id="vhf" type="button" tabindex="-1" aria-pressed="false" data-i18n="vhf">机载 VHF</button><button id="static" type="button" tabindex="-1" aria-pressed="false" data-i18n="static">强杂音</button><button id="clean" type="button" tabindex="-1" aria-pressed="false" data-i18n="clean">干声</button></div></div>
<p id="effect-note" class="muted"></p>
<p class="sample-label" data-i18n="sameText">每个声音朗读同一段：</p><blockquote id="transcript"></blockquote>
<div class="setting-row bottom-row"><p id="signal-note" class="muted"></p><button id="sequence" class="sequence" type="button" tabindex="-1" data-i18n="sequence">▶ 依次试听</button></div>
</section>
<p id="loading" class="status" role="status" data-i18n="loading">正在准备试听…</p>
<section id="voices" class="voice-grid" aria-label="飞行员声音候选"></section>
<p class="footnote" data-i18n="note">试听不会改变游戏声音。选好后，在对话中回复 A / B / C / D 即可。</p><p id="error" role="alert" hidden></p>
</main>
<aside id="player" class="player" aria-label="试听播放器" hidden>
<div class="player-info"><strong id="playing-name"></strong><span id="playing-type" class="muted"></span></div>
<button id="pause" type="button" tabindex="-1" aria-label="暂停">Ⅱ</button>
<label class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.05" aria-label="播放进度"><span id="duration">0:00</span></label>
<label class="volume"><span data-i18n="volume">音量</span><input id="volume" type="range" min="0" max="100" value="70" aria-label="音量"></label><button id="stop" type="button" tabindex="-1" data-i18n="stop">停止</button>
</aside>
<script type="module" src="./player.js?v=five-cast-vhf-1"></script>
</body></html>
