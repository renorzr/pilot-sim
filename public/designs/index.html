<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>飞行模拟 · 三种设计方向</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #10161d; color: #edf3f9; font: 16px/1.7 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1320px; margin: auto; padding: 48px 24px 64px; }
    h1 { font-size: clamp(26px, 5vw, 40px); line-height: 1.3; margin: 0 0 12px; }
    h2 { font-size: 22px; margin: 0; }
    p { color: #aebdcd; margin: 8px 0 20px; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 24px 0 40px; }
    a { color: #98d5ff; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #98d5ff; outline-offset: 5px; }
    section { margin: 0 0 56px; scroll-margin-top: 24px; }
    .heading { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; }
    .image-link { display: block; }
    img { display: block; width: 100%; height: auto; background: #202c39; border-radius: 8px; }
    footer { color: #aebdcd; border-top: 1px solid #304050; padding-top: 20px; }
    @media (max-width: 600px) { main { padding: 28px 16px; } section { margin-bottom: 36px; } }
  </style>
</head>
<body>
  <main>
    <h1>飞行模拟 · 设计草案</h1>
    <p>三张图依次对应方案 1、2、3。点击图片可打开原图放大查看。这些是视觉概念图，尚未接入游戏操作。</p>
    <nav aria-label="跳转到设计方案">
      <a href="#concept-1">1 · 沉浸式驾驶舱</a>
      <a href="#concept-2">2 · 教学辅助驾驶舱</a>
      <a href="#concept-3">3 · 轻量低多边形驾驶舱</a>
    </nav>
    <section id="concept-1" aria-labelledby="title-1">
      <div class="heading"><h2 id="title-1">1 · 沉浸式驾驶舱</h2><a href="cockpit-immersive.png">查看原图</a></div>
      <p>强调驾驶舱氛围，主要仪表与操作集中在下方，窗外保留宽阔视野。</p>
      <a class="image-link" href="cockpit-immersive.png" aria-label="打开方案 1 原图"><img src="cockpit-immersive.webp" width="1586" height="992" alt="方案 1：写实风格客机驾驶舱，窗外是海岸机场，下方显示主要仪表和控制开关。" fetchpriority="high"></a>
    </section>
    <section id="concept-2" aria-labelledby="title-2">
      <div class="heading"><h2 id="title-2">2 · 教学辅助驾驶舱</h2><a href="cockpit-guided.png">查看原图</a></div>
      <p>增加飞行引导标记与阶段提示，方便新手理解降落步骤。</p>
      <a class="image-link" href="cockpit-guided.png" aria-label="打开方案 2 原图"><img src="cockpit-guided.webp" width="1586" height="992" alt="方案 2：驾驶舱窗外有辅助引导框，右侧显示对准跑道、保持下降和准备接地的步骤。" loading="lazy"></a>
    </section>
    <section id="concept-3" aria-labelledby="title-3">
      <div class="heading"><h2 id="title-3">3 · 轻量低多边形驾驶舱</h2><a href="cockpit-low-poly.png">查看原图</a></div>
      <p>简化场景和材质，放大核心仪表，采用轻松直观的游戏风格。</p>
      <a class="image-link" href="cockpit-low-poly.png" aria-label="打开方案 3 原图"><img src="cockpit-low-poly.webp" width="1586" height="992" alt="方案 3：低多边形风格的海岸、山地和跑道，下方是大尺寸简化仪表和开关。" loading="lazy"></a>
    </section>
    <footer>后续游戏将使用首页；设计草案保留在 /designs/。</footer>
  </main>
</body>
</html>
